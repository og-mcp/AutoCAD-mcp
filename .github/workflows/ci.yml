name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run Pytest test suite
        run: |
          pytest -v

      - name: Verify CLI health diagnostics
        run: |
          architect-cad-health

      - name: Execute headless generation demo
        run: |
          python examples/headless_demo.py

  docker-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: architect-cad-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root execution (UID 10001)
        run: |
          UID_CHECK=$(docker run --rm --entrypoint id architect-cad-mcp:test -u)
          echo "Container User ID: $UID_CHECK"
          if [ "$UID_CHECK" -ne 10001 ]; then
            echo "Security check failed: container must run as non-root UID 10001"
            exit 1
          fi

      - name: Run Docker health check probe
        run: |
          docker run --rm architect-cad-mcp:test --health
