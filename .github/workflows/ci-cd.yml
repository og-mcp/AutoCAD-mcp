name: CI/CD

# Single pipeline:  test (matrix)  ->  docker build + verify  ->  publish to Docker Hub
#  - Pull requests: test + docker verify only
#  - Push to main:  test + docker verify + publish (only when pyproject.toml version changes)
#  - Manual run:    Actions -> CI/CD -> Run workflow (tick "force" to publish without a version bump)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish Docker image even if the version did not change"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel an in-flight publish on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ---------------------------------------------------------------------------
  # 1. CI: unit tests, health probe, headless demo across Python versions
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: make install

    - name: Run tests
      run: make test

    - name: Run health check
      run: make health

    - name: Run headless demo
      run: make demo

  # ---------------------------------------------------------------------------
  # 2. Docker: build image and verify security + health (no push)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & verify
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: architect-cad-mcp:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify container runs as non-root (UID 10001)
      run: |
        UID_IN_CONTAINER=$(docker run --rm --entrypoint id architect-cad-mcp:ci -u)
        echo "Container UID: $UID_IN_CONTAINER"
        [ "$UID_IN_CONTAINER" = "10001" ] || { echo "::error::Container must run as UID 10001"; exit 1; }

    - name: Container health check
      run: docker run --rm architect-cad-mcp:ci --health

  # ---------------------------------------------------------------------------
  # 3. CD: publish multi-arch image to Docker Hub when the version changes
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Python (for Makefile pyproject.toml version extraction)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check if version changed
      id: version-check
      run: |
        if git rev-parse HEAD^ >/dev/null 2>&1; then
          PREV_VERSION=$(git show HEAD^:pyproject.toml 2>/dev/null | grep -m1 -E '^version' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "none")
        else
          PREV_VERSION="none"
        fi
        CURR_VERSION=$(make version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "Previous version: $PREV_VERSION"
        echo "Current version:  $CURR_VERSION"
        echo "version=$CURR_VERSION" >> "$GITHUB_OUTPUT"

        if [ "$PREV_VERSION" != "$CURR_VERSION" ] || [ "${{ inputs.force }}" = "true" ]; then
          CHANGED=true
        else
          CHANGED=false
        fi

        if [ "$CHANGED" = "true" ] && { [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; }; then
          echo "::warning::DOCKER_USERNAME / DOCKER_PASSWORD secrets are not set - skipping publish."
          CHANGED=false
        fi
        echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU (multi-arch)
      if: steps.version-check.outputs.changed == 'true'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      if: steps.version-check.outputs.changed == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: steps.version-check.outputs.changed == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Publish the Docker image via Makefile
      if: steps.version-check.outputs.changed == 'true'
      run: make publish DOCKER_USERNAME="$DOCKER_USERNAME"

    - name: Summary
      run: |
        VERSION="${{ steps.version-check.outputs.version }}"
        if [ "${{ steps.version-check.outputs.changed }}" = "true" ]; then
          echo "### Published \`$DOCKER_USERNAME/architect-cad-mcp:$VERSION\` and \`:latest\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### Docker publish skipped (version $VERSION unchanged or secrets missing)" >> "$GITHUB_STEP_SUMMARY"
        fi
