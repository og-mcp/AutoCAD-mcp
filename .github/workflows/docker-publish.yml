name: Docker Image CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the version did not change"
        type: boolean
        default: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Python (for Makefile pyproject.toml version extraction)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Check if version changed
      id: version-check
      run: |
        if git rev-parse HEAD^ >/dev/null 2>&1; then
          PREV_VERSION=$(git show HEAD^:pyproject.toml 2>/dev/null | grep -m1 -E '^version' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "none")
        else
          PREV_VERSION="none"
        fi
        CURR_VERSION=$(make version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "Previous version: $PREV_VERSION"
        echo "Current version: $CURR_VERSION"
        echo "version=$CURR_VERSION" >> "$GITHUB_OUTPUT"
        if [ "$PREV_VERSION" != "$CURR_VERSION" ] || [ "${{ inputs.force }}" = "true" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      run: make install

    - name: Run Tests
      run: make test

    - name: Run Health Check
      run: make health

    - name: Set up QEMU (multi-arch)
      if: steps.version-check.outputs.changed == 'true'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      if: steps.version-check.outputs.changed == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: steps.version-check.outputs.changed == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Publish the Docker image via Makefile
      if: steps.version-check.outputs.changed == 'true'
      run: make publish DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

    - name: Summary
      run: |
        if [ "${{ steps.version-check.outputs.changed }}" = "true" ]; then
          echo "Published ${{ secrets.DOCKER_USERNAME }}/architect-cad-mcp:${{ steps.version-check.outputs.version }} (+ :latest)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Version unchanged (${{ steps.version-check.outputs.version }}) - skipped Docker publish." >> "$GITHUB_STEP_SUMMARY"
        fi
