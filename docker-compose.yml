services:
  architect-cad-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: architect-cad-mcp:latest
    container_name: architect-cad-mcp
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./cad_output:/app/cad_output
    environment:
      - MPLBACKEND=Agg
      - CAD_OUTPUT_DIR=/app/cad_output
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "architect-cad-health", "--quiet"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
