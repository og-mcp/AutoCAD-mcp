[project]
name = "architect-cad-mcp"
version = "1.0.1"
description = "Dedicated 2D Architectural AutoCAD MCP Server with AIA layers, multi-plane orthographic generator (Floor Plan, RCP, Structural, Roof, Elevations, Sections), Neufert DRC, and House/Building/Workplace templates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["autocad", "architecture", "2d-cad", "mcp", "dxf", "floor-plan", "aia-layers", "neufert"]
dependencies = [
    "mcp[cli]>=1.2.1,<2.0",
    "ezdxf>=1.0.0",
    "matplotlib>=3.7",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[dependency-groups]
dev = ["pytest>=7.0"]

[project.scripts]
architect-cad-mcp = "architect_cad_mcp.server:main"
architect-cad-health = "architect_cad_mcp.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["architect_cad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
